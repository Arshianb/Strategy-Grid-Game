<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strategy Game</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #1e2a45 0%, #0f172a 55%, #0b1220 100%);
    min-height: 100dvh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  canvas {
    touch-action: none;
    display: block;
    max-width: 100%;
    image-rendering: -webkit-optimize-contrast;
  }
  .glass { background: rgba(30,41,59,0.55); backdrop-filter: blur(10px); border: 1px solid rgba(148,163,184,0.15); }
  .btn-press:active { transform: scale(0.94); }
  #boardWrap {
    border-radius: 1.25rem;
    padding: 10px;
    background: linear-gradient(145deg, #1e293b, #0f172a);
    box-shadow: 0 20px 40px -12px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
    border: 1px solid rgba(148,163,184,0.15);
  }

  /* Chat modal */
  #chatModal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    align-items: flex-end;
    justify-content: center;
    background: rgba(0,0,0,0.45);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #chatModal.open { display: flex; }
  #chatPanel {
    width: 100%;
    max-width: 600px;
    border-radius: 1.25rem 1.25rem 0 0;
    background: #1e293b;
    border: 1px solid rgba(148,163,184,0.15);
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    max-height: 60dvh;
  }
  #chatbox {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    min-height: 0;
  }
  .chat-msg-red   { color: #f87171; }
  .chat-msg-blue  { color: #60a5fa; }
  .chat-msg-sys   { color: #94a3b8; }
</style>
</head>
<body class="flex flex-col items-center min-h-[100dvh] gap-3 px-3 py-4">

<!-- Header -->
<div class="w-full max-w-2xl flex flex-col items-center gap-1 text-center">
  <h1 class="text-xl font-bold text-white tracking-tight flex items-center gap-2">🎮 Strategy Grid Game</h1>
  <div id="status" class="px-4 py-1.5 rounded-full text-sm font-medium glass text-slate-300">Connecting...</div>
  <p id="mycolor" class="text-sm font-semibold"></p>
</div>

<!-- Mode buttons -->
<div class="flex gap-3 w-full max-w-2xl">
  <button id="btnMove" class="btn-press flex-1 py-3 rounded-2xl bg-blue-600 text-white text-base font-semibold shadow-lg shadow-blue-900/30 transition flex items-center justify-center gap-2" onclick="setMode('move')">🚶 Move</button>
  <button id="btnWall" class="btn-press flex-1 py-3 rounded-2xl bg-slate-700 text-white text-base font-semibold shadow-lg shadow-slate-900/30 transition flex items-center justify-center gap-2" onclick="setMode('wall')">🧱 Wall</button>
  <button onclick="openChat()" class="btn-press px-4 py-3 rounded-2xl bg-slate-700 text-white text-base font-semibold shadow-lg transition flex items-center justify-center gap-1 relative">
    💬
    <span id="chatBadge" class="hidden absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-[10px] flex items-center justify-center text-white font-bold"></span>
  </button>
</div>

<!-- Wall controls -->
<div id="wallControls" class="hidden gap-3 w-full max-w-2xl">
  <button id="btnEndWall" onclick="endWallTurn()"
    class="btn-press flex-1 py-2 rounded-2xl bg-green-700 hover:bg-green-600 text-white text-sm font-semibold transition flex items-center justify-center gap-1">
    ✅ Done placing walls
  </button>
  <button id="btnCancelWall" onclick="cancelWallTurn()"
    class="btn-press flex-1 py-2 rounded-2xl bg-rose-800 hover:bg-rose-700 text-white text-sm font-semibold transition flex items-center justify-center gap-1">
    ✖ Cancel
  </button>
</div>
<div id="wallInfo" class="hidden text-amber-300 text-xs text-center"></div>

<!-- Canvas -->
<div id="boardWrap">
  <canvas id="board" class="rounded-xl cursor-pointer"></canvas>
</div>

<p id="errmsg" class="text-red-400 text-sm h-5 text-center font-medium"></p>

<!-- Chat Modal -->
<div id="chatModal" onclick="handleModalBg(event)">
  <div id="chatPanel">
    <div class="flex items-center justify-between mb-1">
      <span class="text-slate-300 text-sm font-semibold">💬 Chat</span>
      <button onclick="closeChat()" class="btn-press text-slate-400 hover:text-white text-xl leading-none px-1">✕</button>
    </div>
    <div id="chatbox"></div>
    <div class="flex gap-2 pt-1">
      <input id="chatInput" type="text" maxlength="200" placeholder="Type a message..."
        class="flex-1 bg-slate-800 rounded-lg px-3 py-2 text-white text-sm outline-none border border-slate-700"
        onkeydown="if(event.key==='Enter') sendChat()">
      <button onclick="sendChat()" class="btn-press px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold rounded-lg transition">Send</button>
    </div>
  </div>
</div>

<script>
const SESSION_ID = "{{ session_id }}";
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");

let state = null, myColor = null;
let rows = 9, cols = 9, maxWalls = 1;
let mode = "move", hints = [];
let CELL = 52, PAD = 20;
let cssW = 0, cssH = 0, DPR = 1;
let ws = null;
let unreadChat = 0, chatOpen = false;
let pulse = 0;

function computeCell() {
  const maxW = Math.min(window.innerWidth - 44, 560);
  CELL = Math.max(30, Math.floor((maxW - PAD * 2) / Math.max(rows, cols)));
}

function resize() {
  computeCell();
  DPR = window.devicePixelRatio || 1;
  cssW = PAD * 2 + CELL * cols;
  cssH = PAD * 2 + CELL * rows;

  // Fix blurriness: back-store canvas at real device pixel density
  canvas.width  = Math.round(cssW * DPR);
  canvas.height = Math.round(cssH * DPR);
  canvas.style.width  = cssW + "px";
  canvas.style.height = cssH + "px";

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = true;
  draw();
}
window.addEventListener("resize", resize);

function openChat() {
  chatOpen = true;
  unreadChat = 0;
  updateBadge();
  document.getElementById("chatModal").classList.add("open");
  setTimeout(() => {
    const box = document.getElementById("chatbox");
    box.scrollTop = box.scrollHeight;
    document.getElementById("chatInput").focus();
  }, 50);
}
function closeChat() {
  chatOpen = false;
  document.getElementById("chatModal").classList.remove("open");
}
function handleModalBg(e) {
  if (e.target === document.getElementById("chatModal")) closeChat();
}
function updateBadge() {
  const badge = document.getElementById("chatBadge");
  if (unreadChat > 0 && !chatOpen) {
    badge.textContent = unreadChat > 9 ? "9+" : unreadChat;
    badge.classList.remove("hidden");
    badge.classList.add("flex");
  } else {
    badge.classList.add("hidden");
    badge.classList.remove("flex");
  }
}

function setMode(m) {
  mode = m;
  refreshHints();
  document.getElementById("btnMove").className =
    `btn-press flex-1 py-3 rounded-2xl text-white text-base font-semibold shadow-lg transition flex items-center justify-center gap-2 ${m==="move"?"bg-blue-600 shadow-blue-900/30":"bg-slate-700 shadow-slate-900/30"}`;
  document.getElementById("btnWall").className =
    `btn-press flex-1 py-3 rounded-2xl text-white text-base font-semibold shadow-lg transition flex items-center justify-center gap-2 ${m==="wall"?"bg-amber-600 shadow-amber-900/30":"bg-slate-700 shadow-slate-900/30"}`;
  updateWallControls();
  draw();
}

function refreshHints() {
  if (!state || !myColor) { hints = []; return; }
  hints = mode === "wall" ? getAllWallEdges() : getMoveHints(state.players[myColor]);
}

function updateWallControls() {
  const wallCtrl = document.getElementById("wallControls");
  const wallInfo = document.getElementById("wallInfo");
  const exhausted = state.wall_limit != null &&
    (state.walls_used?.[myColor] ?? 0) >= state.wall_limit;
  document.getElementById("btnWall").disabled = exhausted;
  document.getElementById("btnWall").classList.toggle("opacity-40", exhausted);
  if (!state || mode !== "wall" || state.turn !== myColor) {
    wallCtrl.classList.add("hidden"); wallCtrl.classList.remove("flex");
    wallInfo.classList.add("hidden"); return;
  }
  wallCtrl.classList.remove("hidden"); wallCtrl.classList.add("flex");
  const hasPending = state.pending_walls && state.pending_walls.length > 0;
  const btn = document.getElementById("btnEndWall");
  btn.disabled = !hasPending;
  btn.classList.toggle("opacity-40", !hasPending);
  wallInfo.classList.remove("hidden");
  const dir = state.pending_direction;
  const remaining = state.wall_limit != null
    ? ` (${state.wall_limit - (state.walls_used?.[myColor] ?? 0)} left)`
    : "";
  wallInfo.textContent = dir
    ? `Placed ${state.pending_walls.length}/${maxWalls} walls (${dir === "h" ? "horizontal" : "vertical"}) — must continue same direction`
    : `Place up to ${maxWalls} wall${maxWalls > 1 ? "s" : ""} in one direction${remaining}`;

}

function cellCenter(r, c) {
  return [PAD + c * CELL + CELL / 2, PAD + r * CELL + CELL / 2];
}
function wallKey(a, b) {
  return JSON.stringify([a, b].map(x => x.join(",")).sort());
}
function getAllWallEdges() {
  if (!state) return [];
  const allWalls = new Set([
    ...state.walls.map(w => wallKey([w.r1, w.c1], [w.r2, w.c2])),
    ...(state.pending_walls || []).map(w => wallKey([w[0], w[1]], [w[2], w[3]]))
  ]);
  const result = [], seen = new Set();
  const pendingDir = state.pending_direction;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      for (const [dr, dc] of [[1,0],[0,1]]) {
        const nr = r+dr, nc = c+dc;
        if (nr >= rows || nc >= cols) continue;
        const dir = dr === 1 ? "h" : "v";
        if (pendingDir && dir !== pendingDir) continue;
        const key = wallKey([r,c],[nr,nc]);
        if (!allWalls.has(key) && !seen.has(key)) { seen.add(key); result.push([[r,c],[nr,nc]]); }
      }
    }
  }
  return result;
}
function getMoveHints(pos) {
  const {row: r, col: c} = pos;
  const wallSet = new Set(state.walls.map(w => wallKey([w.r1,w.c1],[w.r2,w.c2])));
  const result = [];
  for (const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
    const nr=r+dr, nc=c+dc;
    if (nr<0||nr>=rows||nc<0||nc>=cols) continue;
    if (!wallSet.has(wallKey([r,c],[nr,nc]))) result.push([nr,nc]);
  }
  return result;
}

const PLAYER_COLORS = {
  red:  { main: "#ef4444", light: "#fca5a5", dark: "#991b1b", ring: "#4ade80" },
  blue: { main: "#3b82f6", light: "#93c5fd", dark: "#1e3a8a", ring: "#4ade80" }
};
const WALL_COLORS = { red: "#dc2626", blue: "#2563eb" };

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBoardBackground() {
  // outer board bg
  const g = ctx.createLinearGradient(0, 0, 0, cssH);
  g.addColorStop(0, "#243147");
  g.addColorStop(1, "#111a2e");
  ctx.fillStyle = g;
  roundRect(0, 0, cssW, cssH, 16);
  ctx.fill();

  // checkerboard cells
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = PAD + c * CELL, y = PAD + r * CELL;
      ctx.fillStyle = (r + c) % 2 === 0 ? "rgba(255,255,255,0.035)" : "rgba(0,0,0,0.10)";
      ctx.fillRect(x, y, CELL, CELL);
    }
  }

  // goal zones
  for (const [color, goalRow] of Object.entries(state.goals)) {
    const c = PLAYER_COLORS[color];
    const y = PAD + goalRow * CELL;
    const grad = ctx.createLinearGradient(0, y, 0, y + CELL);
    grad.addColorStop(0, c.main + "33");
    grad.addColorStop(1, c.main + "0d");
    ctx.fillStyle = grad;
    ctx.fillRect(PAD, y, cols * CELL, CELL);
    ctx.fillStyle = c.main;
    ctx.font = `700 ${Math.max(11, CELL * 0.24)}px system-ui, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.globalAlpha = 0.85;
    ctx.fillText(color === "red" ? "🔴 GOAL" : "🔵 GOAL", PAD + cols * CELL / 2, y + CELL / 2);
    ctx.globalAlpha = 1;
  }

  // crisp grid lines (aligned to half-pixel for sharpness)
  ctx.strokeStyle = "rgba(148,163,184,0.25)";
  ctx.lineWidth = 1;
  for (let i = 0; i <= cols; i++) {
    const x = Math.round(PAD + i * CELL) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, PAD); ctx.lineTo(x, PAD + rows * CELL); ctx.stroke();
  }
  for (let i = 0; i <= rows; i++) {
    const y = Math.round(PAD + i * CELL) + 0.5;
    ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(PAD + cols * CELL, y); ctx.stroke();
  }
}

function drawMoveHints() {
  ctx.save();
  for (const [r,c] of hints) {
    const x = PAD + c * CELL, y = PAD + r * CELL;
    const [cx, cy] = cellCenter(r, c);
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, CELL * 0.42);
    grad.addColorStop(0, "rgba(96,165,250,0.55)");
    grad.addColorStop(1, "rgba(96,165,250,0.05)");
    ctx.fillStyle = grad;
    roundRect(x + 3, y + 3, CELL - 6, CELL - 6, 8);
    ctx.fill();
    ctx.strokeStyle = "rgba(147,197,253,0.6)";
    ctx.lineWidth = 1.5;
    roundRect(x + 3, y + 3, CELL - 6, CELL - 6, 8);
    ctx.stroke();
  }
  ctx.restore();
}

function drawWallLine(r1,c1,r2,c2, color, alpha, dashed, glow) {
  const [x1,y1] = cellCenter(r1,c1), [x2,y2] = cellCenter(r2,c2);
  const mx=(x1+x2)/2, my=(y1+y2)/2, dx=(y2-y1)*0.42, dy=(x2-x1)*0.42;
  const w = Math.max(6, CELL * 0.16);

  ctx.save();
  if (glow) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 8;
  }
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = w;
  ctx.lineCap = "round";
  if (dashed) ctx.setLineDash([6,5]);
  ctx.beginPath();
  ctx.moveTo(mx-dx,my-dy);
  ctx.lineTo(mx+dx,my+dy);
  ctx.stroke();
  ctx.restore();
}

function drawWallHints() {
  for (const [[r1,c1],[r2,c2]] of hints) {
    drawWallLine(r1,c1,r2,c2, "#fbbf24", 0.25, false, false);
  }
}

function drawPendingWalls() {
  for (const [r1,c1,r2,c2] of (state.pending_walls || [])) {
    drawWallLine(r1,c1,r2,c2, "#fbbf24", 0.9, true, true);
  }
}

function drawPlacedWalls() {
  for (const w of state.walls) {
    const col = WALL_COLORS[w.owner] || "#f59e0b";
    drawWallLine(w.r1, w.c1, w.r2, w.c2, col, 1, false, false);
  }
}

function drawPlayers() {
  for (const [color, pos] of Object.entries(state.players)) {
    const [x,y] = cellCenter(pos.row, pos.col);
    const c = PLAYER_COLORS[color];
    const R = CELL * 0.34;

    // turn glow ring (pulsing)
    if (state.turn === color && !state.winner) {
      const pr = R + 6 + Math.sin(pulse) * 2;
      ctx.save();
      ctx.strokeStyle = c.ring;
      ctx.lineWidth = 2.5;
      ctx.globalAlpha = 0.85;
      ctx.beginPath(); ctx.arc(x, y, pr, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }

    // drop shadow
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.5)";
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 2;

    // 3D sphere piece
    const grad = ctx.createRadialGradient(x - R*0.35, y - R*0.35, R*0.15, x, y, R);
    grad.addColorStop(0, c.light);
    grad.addColorStop(0.5, c.main);
    grad.addColorStop(1, c.dark);
    ctx.beginPath();
    ctx.arc(x, y, R, 0, Math.PI*2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();

    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(15,23,42,0.6)";
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2); ctx.stroke();

    // small highlight dot
    ctx.beginPath();
    ctx.arc(x - R*0.35, y - R*0.35, R*0.22, 0, Math.PI*2);
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.fill();
  }
}

function draw() {
  if (!state) {
    ctx.clearRect(0, 0, cssW, cssH);
    return;
  }
  ctx.clearRect(0, 0, cssW, cssH);
  drawBoardBackground();
  if (mode === "move") drawMoveHints();
  if (mode === "wall") drawWallHints();
  drawPendingWalls();
  drawPlacedWalls();
  drawPlayers();
}

// smooth pulsing animation loop for turn indicator
function animate() {
  pulse += 0.06;
  if (state && !state.winner) draw();
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

function updateStatus() {
  const statusEl = document.getElementById("status");
  const colorEl = document.getElementById("mycolor");
  colorEl.textContent = myColor ? `You are ${myColor === "red" ? "🔴 Red" : "🔵 Blue"}` : "";
  colorEl.className = `text-sm font-semibold ${myColor === "red" ? "text-red-400" : "text-blue-400"}`;
  if (!state) { statusEl.textContent = "Connecting..."; return; }
  if (state.winner) {
    statusEl.textContent = `🏆 ${state.winner === "red" ? "Red" : "Blue"} wins!`;
    statusEl.className = "px-4 py-1.5 rounded-full text-sm font-bold glass text-amber-300"; return;
  }
  const isMyTurn = state.turn === myColor;
  statusEl.textContent = isMyTurn ? "Your turn" : `Waiting for ${state.tun === "red" ? "Red" : "Blue"}`;
  statusEl.className = `px-4 py-1.5 rounded-full text-sm font-medium glass ${isMyTurn ? "text-green-300" : "text-slate-300"}`;
}

function showError(msg) {
  const el = document.getElementById("errmsg");
  el.textContent = msg;
  setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 2500);
}

function applyState(s) {
  state = s;
  rows = s.rows; cols = s.cols; maxWalls = s.max_walls;
  refreshHints(); updateStatus(); updateWallControls(); resize();
}

function senderLabel(msg) {
  const color = msg.color || msg.sender || "";
  if (color.includes("red"))  return { label: "Red Player",  cls: "chat-msg-red" };
  if (color.includes("blue")) return { label: "Blue Player", cls: "chat-msg-blue" };
  return { label: color || "?", cls: "chat-msg-sys" };
}

function appendChat(msg) {
  const box = document.getElementById("chatbox");
  const { label, cls } = senderLabel(msg);
  const div = document.createElement("div");
  div.className = `px-2 py-1 rounded text-xs ${cls}`;
  div.textContent = `${label}: ${msg.text}`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  if (!chatOpen) {
    unreadChat++;
    updateBadge();
  }
}

function sendChat() {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ action: "chat", text }));
  input.value = "";
}

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws/${SESSION_ID}`);
  ws.onmessage = (ev) => {
    const data = JSON.parse(ev.data);
    if (data.type === "init") {
      myColor = data.my_color;
      applyState(data.state);
      (data.state.chat || []).forEach(appendChat);
    } else if (data.type === "state") {
      applyState(data.state);
    } else if (data.type === "chat") {
      appendChat(data.msg);
    } else if (data.type === "error") {
      showError(data.msg);
    }
  };
  ws.onclose = () => {
    document.getElementById("status").textContent = "Disconnected — reconnecting...";
    setTimeout(connect, 1500);
  };
  ws.onerror = () => ws.close();
}

function send(payload) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(payload));
}

function endWallTurn()    { send({ action: "end_wall_turn" }); }
function cancelWallTurn() { send({ action: "cancel_wall_turn" }); }

canvas.addEventListener("click", (ev) => {
  if (!state || !myColor || state.winner || state.turn !== myColor) return;
  const rect = canvas.getBoundingClientRect();
  // rect.width/height are CSS pixels — matches our logical coordinate space (PAD/CELL),
  // so no extra DPR scaling is needed here.
  const x = ev.clientX - rect.left;
  const y = ev.clientY - rect.top;

  if (mode === "move") {
    const c = Math.floor((x - PAD) / CELL);
    const r = Math.floor((y - PAD) / CELL);
    if (hints.some(([hr,hc]) => hr===r && hc===c))
      send({ action: "move", row: r, col: c });
  } else {
    let best = null, bestDist = Infinity;
    for (const edge of hints) {
      const [[r1,c1],[r2,c2]] = edge;
      const [x1,y1] = cellCenter(r1,c1), [x2,y2] = cellCenter(r2,c2);
      const d = Math.hypot(x-(x1+x2)/2, y-(y1+y2)/2);
      if (d < bestDist) { bestDist = d; best = edge; }
    }
    if (best && bestDist < CELL * 0.5)
      send({ action: "wall", r1: best[0][0], c1: best[0][1], r2: best[1][0], c2: best[1][1] });
  }
});

resize();
connect();
</script>
</body>
</html>
